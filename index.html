    --ink:#1b2320;--dim:#5d6b65;--faint:#93a19b;--accent:#15846c;
    --bg:#f2f5f4;--card:#ffffff;--line:#e3e9e6;
    --up-bg:#e8f7f2;--up-br:#4bc0a5;
    --tile:#ffffff;--qrink:#16211d}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);cursor:none;
    font-family:'Poppins','DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  #stage{height:100%;display:flex;flex-direction:column;gap:2.2vh;
    padding:2.6vh 2.6vw;transition:transform 4s linear}
  .band{flex:none}

  /* 1. identity */
  .idbar{display:flex;align-items:center;justify-content:space-between;gap:3vw;flex-wrap:wrap}
  .meta{text-align:right}
  .metaline{display:flex;align-items:baseline;justify-content:flex-end;gap:1.1vw;
    font-size:2.4vh;font-weight:500;color:var(--ink);white-space:nowrap}
  .metaline .dot{color:var(--faint);font-weight:400}
  .metaline .sk{color:var(--faint);font-size:.72em;letter-spacing:.12em;
    text-transform:uppercase;margin-right:.35vw}
  .metaline .num{font-variant-numeric:tabular-nums}
  .dshort{display:none}
  .brand{display:flex;align-items:center;gap:1vw;min-width:0}
  .mark{background:var(--mark) center/contain no-repeat;aspect-ratio:512/432;
    height:5.4vh;flex:none}
  .org{font-size:1.9vh;letter-spacing:.22em;text-transform:uppercase;
    color:var(--accent);font-weight:600;white-space:nowrap}
  .dates{text-align:right;white-space:nowrap}
  .hijri{font-size:1.7vh;color:var(--faint);margin-top:.5vh}

  /* 2. clock band: current time is the hero */
  /* 3. the five, equal weight, adhan and iqamah both labelled */
  .allhead{display:none}
  .all{flex:1;min-height:0;display:flex;flex-direction:column;gap:1.1vh}
  .p{flex:1;background:var(--card);border:.15vh solid var(--line);border-radius:1.4vh;
    padding:0 2.4vw;display:grid;grid-template-columns:1fr auto auto;
    align-items:center;gap:2.5vw;transition:background .4s,border-color .4s,flex .4s}
  .p .pn{font-size:3.4vh;font-weight:600;letter-spacing:.01em;color:var(--ink);
    display:flex;align-items:baseline;gap:1.2vw;min-width:0}
  .p .chip{font-size:1.9vh;font-weight:600;color:var(--accent);
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .p .cell{display:flex;align-items:baseline;gap:.9vw;justify-content:flex-end}
  .p .k{font-size:1.55vh;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .p .adh{font-size:2.8vh;font-weight:500;color:var(--dim);
    font-variant-numeric:tabular-nums;min-width:8.5ch;text-align:right}
  .p .iqa{font-size:4.6vh;font-weight:700;line-height:1.05;
    font-variant-numeric:tabular-nums;min-width:8.5ch;text-align:right}
  .p.past{opacity:.42}
  .p.up{flex:1.55;background:var(--up-bg);border-color:var(--up-br);border-width:.3vh}
  .p.up .pn{color:var(--accent);font-size:4.6vh}
  .p.up .adh{font-size:3.2vh}
  .p.up .iqa{font-size:7vh;color:var(--accent)}
  .p.up .chip{font-size:2.2vh}

  /* 4. jumu'ah */
  .info{display:flex;align-items:center;justify-content:center;gap:.5vh 2.4vw;
    flex-wrap:wrap;padding:.4vh 2vw}
  .info .k{font-size:1.5vh;letter-spacing:.14em;text-transform:uppercase;
    color:var(--faint);white-space:nowrap}
  .info .v{font-size:1.9vh;font-weight:600;color:var(--dim);
    font-variant-numeric:tabular-nums;white-space:nowrap;margin-left:.6vw}

  /* 5. QR strip, equal halves */
  .qrbar{display:grid;grid-template-columns:1fr 1fr;gap:1.4vw}
  .qrc{display:flex;align-items:center;justify-content:center;gap:1.4vw;
    background:var(--card);border:.15vh solid var(--line);
    border-radius:1.2vh;padding:1.2vh 1.4vw}
  .qrbox{background:var(--tile);border-radius:.8vh;padding:.7vh;line-height:0;flex:none}
  .qrbox svg{display:block;width:var(--qr);height:var(--qr);color:var(--qrink)}
  .qrt{font-size:1.95vh;font-weight:600;color:var(--ink)}
  .qrs{font-size:1.5vh;color:var(--faint);margin-top:.2vh}

  /* out of range */
  #stale{position:fixed;inset:0;background:#3a0d0d;display:none;
    flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:6vh 8vw;z-index:9}
  #stale.on{display:flex}
  #stale .mark{height:9vh;opacity:.5;margin-bottom:4vh}
  #stale h1{font-size:7vh;color:#ff6b6b;font-weight:700;line-height:1.1}
  #stale p{font-size:3vh;color:#ffd9d9;margin-top:3vh;line-height:1.5;max-width:40ch}
  #stale .sm{font-size:2vh;color:#e0a0a0;margin-top:4vh}

  /* 720p panels: lift the small type so it survives a 32 inch screen */
  @media (max-height:820px){
    .org{font-size:2.1vh} .loc{font-size:1.6vh}
    .greg{font-size:2.15vh} .hijri{font-size:1.75vh}
    .sun .k{font-size:1.6vh} .p .k{font-size:1.6vh}
    .qrs{font-size:1.7vh} .jum .w{font-size:1.9vh}
  }

  /* portrait: same bands, tighter type, compact date so the top line fits */
  @media (orientation:portrait){
    :root{--qr:8.5vh}
    #stage{gap:1.4vh;padding:2vh 3vw}
    .idbar{flex-direction:column;align-items:flex-start;gap:.7vh}
    .dlong{display:none} .dshort{display:inline}
    .meta{text-align:left;width:100%}
    .metaline{justify-content:flex-start;font-size:2vh;gap:1.8vw}
    .hijri{font-size:1.5vh;margin-top:.3vh}
    .all{gap:.9vh}
    .allhead{display:grid;grid-template-columns:1fr 26% 32%;gap:2.5vw;
      padding:0 3.5vw;margin-bottom:-.3vh}
    .allhead span{font-size:1.35vh;letter-spacing:.16em;text-transform:uppercase;
      color:var(--faint);text-align:right}
    .p{padding:0 3.5vw;gap:2.5vw;grid-template-columns:1fr 26% 32%}
    .p .pn{font-size:2.7vh;flex-direction:column;align-items:flex-start;gap:.2vh}
    .p .chip{font-size:1.6vh}
    .p .k{display:none}
    .p .cell{gap:0}
    .p .adh{font-size:2.1vh;min-width:0}
    .p .iqa{font-size:3.3vh;min-width:0}
    .p.up{flex:1.45}

  var cols = D.map(function(c){ var o=[c[0]]; for(var i=1;i<c.length;i++) o.push(o[i-1]+c[i]); return o; });
  function day(i){ return cols.map(function(c){ return c[i]; }); }

  var NAMES = ['Fajr','Dhuhr','Asr','Maghrib','Isha'];
  var ADHAN = [0,3,5,7,9], IQAMA = [1,4,6,8,10];

  function hhmm(m){
    m = ((m % 1440) + 1440) % 1440;
    var h = Math.floor(m/60), mi = m%60, ap = h>=12 ? 'PM':'AM';
    h = h%12; if(!h) h=12;
    return h + ':' + (mi<10?'0':'') + mi + ' ' + ap;
  }
  function parse(s){ var a=s.split('-'); return new Date(Date.UTC(+a[0],+a[1]-1,+a[2])); }
  function toISO(d){ return d.toISOString().slice(0,10); }
  function idxFor(iso){ return Math.round((parse(iso) - parse(START)) / 86400000); }

  // Wall clock in Eastvale, never the device's own zone.
  function nowLA(){
    var f = new Intl.DateTimeFormat('en-CA', {timeZone:TZ, year:'numeric',
      month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit',
      second:'2-digit', hour12:false, weekday:'short'});
    var o = {}; f.formatToParts(new Date()).forEach(function(p){ o[p.type]=p.value; });
    var h = (+o.hour) % 24;
    return { iso:o.year+'-'+o.month+'-'+o.day, wd:o.weekday,
             h:h, m:+o.minute, s:+o.second, secs:h*3600 + (+o.minute)*60 + (+o.second) };
  }
  function fmtLong(iso){
    return new Intl.DateTimeFormat('en-US',{timeZone:'UTC',weekday:'long',
      month:'long',day:'numeric',year:'numeric'}).format(parse(iso));
  }
  function fmtShort(iso){
    return new Intl.DateTimeFormat('en-US',{timeZone:'UTC',weekday:'short',
      month:'short',day:'numeric',year:'numeric'}).format(parse(iso));
  }
  function fmtHijri(iso){
    try{ return new Intl.DateTimeFormat('en-US-u-ca-islamic-umalqura',
      {timeZone:'UTC',day:'numeric',month:'long',year:'numeric'})
      .format(parse(iso)).replace(' AH','') + ' AH'; }catch(e){ return ''; }
  }

  // Friday swaps Dhuhr for Jumu'ah, the congregation people arrive for.
  function schedule(i, weekday){
    var r = day(i), out = [];
    for (var p=0; p<5; p++){
      var iq = (p===3) ? (r[ADHAN[3]] + MGOFF) : r[IQAMA[p]];
      var nm = NAMES[p], al = 'Adhan';
      if (p===1 && weekday === 'Fri'){ nm = "Jumu'ah"; iq = JUM; al = 'Dhuhr adhan'; }
      out.push({ name:nm, adhan:r[ADHAN[p]], iqamah:iq, alab:al });
    }
    return { list: out, sunrise: r[2] };
  }

  var E = {};
  ['greg','gregs','hijri','ctime','sunrise','all','jumk','jumv','stale','stage'].forEach(function(k){
    E[k] = document.getElementById(k) || document.querySelector('#'+k);
  });
  E.stage = document.getElementById('stage');

  document.getElementById('stalerange').textContent =
    'Calendar loaded covers ' + fmtLong(START) + ' to ' +
    fmtLong(toISO(new Date(parse(START).getTime()+(NDAYS-1)*86400000))) + '.';

  var painted = '';

  function tick(){
    var t = nowLA(), i = idxFor(t.iso);
    if (i < 0 || i >= NDAYS){ E.stale.classList.add('on'); return; }
    E.stale.classList.remove('on');

    // clock on the top line, same size as the date, no seconds
    var h12 = t.h % 12; if(!h12) h12 = 12;
    E.ctime.textContent = h12 + ':' + (t.m<10?'0':'') + t.m + ' ' + (t.h>=12?'PM':'AM');

    var sch = schedule(i, t.wd), list = sch.list;

    var ni = -1;
    for (var k=0;k<5;k++){ if (list[k].iqamah*60 > t.secs){ ni = k; break; } }
    var target, tname, tomorrow = false;
    if (ni >= 0){ target = list[ni].iqamah*60; tname = list[ni].name; }
    else {
      tomorrow = true;
      var j = i+1;
      if (j < NDAYS){
        var nd = new Date(parse(t.iso).getTime()+86400000);
        var wd = new Intl.DateTimeFormat('en-US',{timeZone:'UTC',weekday:'short'}).format(nd);
        var s2 = schedule(j, wd);
        target = s2.list[0].iqamah*60 + 86400; tname = s2.list[0].name;
      } else { target = list[0].iqamah*60 + 86400; tname = list[0].name; }
    }
    var left = target - t.secs;

    // A prayer whose iqamah started in the last ten minutes is what is
    // actually happening, so that row is the one to highlight. Otherwise
    // highlight the next one. After Isha nothing is upcoming today, so fall
    // back to Fajr and say it is tomorrow's.
    var justPassed = -1;
    for (var q=0;q<5;q++){
      var gone = t.secs - list[q].iqamah*60;
      if (gone >= 0 && gone < 600) justPassed = q;
    }
    var hi = (justPassed >= 0) ? justPassed : (ni >= 0 ? ni : 0);
    var key = t.iso+'|'+hi+'|'+(justPassed>=0?'j':'-')+'|'+(tomorrow?'t':'d');

    if (key !== painted){
      painted = key;
      E.greg.textContent  = fmtLong(t.iso);
      E.gregs.textContent = fmtShort(t.iso);
      E.hijri.textContent = fmtHijri(t.iso);
      E.sunrise.textContent = hhmm(sch.sunrise);
      var html = '';
      for (var k=0;k<5;k++){
        var isUp = (k===hi);
        var cl = 'p' + (isUp ? ' up' : (list[k].iqamah*60 <= t.secs ? ' past' : ''));
        html += '<div class="'+cl+'">'
             +    '<div class="pn">' + list[k].name
             +      (isUp ? '<span class="chip" id="chip"></span>' : '') + '</div>'
             +    '<div class="cell"><span class="k">'+list[k].alab+'</span>'
             +      '<span class="adh">'+hhmm(list[k].adhan)+'</span></div>'
             +    '<div class="cell"><span class="k">Iqamah</span>'
             +      '<span class="iqa">'+hhmm(list[k].iqamah)+'</span></div>'
             +  '</div>';
      }
      E.all.innerHTML = html;

      E.jumk.textContent = (t.wd === 'Fri') ? "Jumu'ah today" : "Jumu'ah";
      E.jumv.textContent = hhmm(JUM);
    }

    var chip = document.getElementById('chip');
    if (chip){
      if (hi === justPassed){
        chip.textContent = 'Iqamah now';
      } else if (left > 3600){
        var hh = Math.floor(left/3600), mm = Math.floor((left%3600)/60);
        chip.textContent = (tomorrow?'tomorrow, in ':'in ') + hh + 'h ' + (mm<10?'0':'') + mm + 'm';
      } else if (left > 60){
        var m2 = Math.floor(left/60), ss = left%60;
        chip.textContent = 'in ' + m2 + 'm ' + (ss<10?'0':'') + ss + 's';
      } else if (left > 0){
        chip.textContent = 'in ' + left + 's';
      } else { chip.textContent = ''; }
    }
  }

  tick();
  setInterval(tick, 1000);

  // burn-in insurance
  setInterval(function(){
    var n = Math.floor(Date.now()/600000);
    E.stage.style.transform = 'translate('+((n%5)-2)+'px,'+((Math.floor(n/5)%5)-2)+'px)';
  }, 60000);

  // overnight reload, picks up a newly published file
  setInterval(function(){
    var t = nowLA();
    if (t.secs >= 10800 && t.secs < 10860) location.reload();
  }, 45000);
})();
</script>
